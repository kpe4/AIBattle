<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформер</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
        }

        #game {
            position: relative;
            width: 800px;
            height: 400px;
            border: 2px solid #000;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: red;
            bottom: 50px;
            left: 100px;
        }

        .ground, .platform {
            position: absolute;
            background: green;
        }

        .ground {
            width: 100%;
            height: 20px;
            bottom: 0;
        }

        .platform {
            width: 100px;
            height: 10px;
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="player"></div>
        <div class="ground"></div>
        <div class="platform" style="bottom: 100px; left: 200px;"></div>
        <div class="platform" style="bottom: 200px; left: 400px;"></div>
        <div class="platform" style="bottom: 150px; left: 600px;"></div>
    </div>
    <script>
        const player = document.getElementById("player");
        const platforms = document.querySelectorAll(".platform");
        let isJumping = false;
        let positionY = 0;
        let positionX = 100; // Начальная позиция по оси X
        let gravity = 2;
        let moveRightInterval;
        let moveLeftInterval;

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp" && !isJumping) {
                jump();
            } else if (event.key === "ArrowRight" && !moveRightInterval) {
                moveRightInterval = setInterval(moveRight, 20);
            } else if (event.key === "ArrowLeft" && !moveLeftInterval) {
                moveLeftInterval = setInterval(moveLeft, 20);
            }
        });

        document.addEventListener("keyup", (event) => {
            if (event.key === "ArrowRight") {
                clearInterval(moveRightInterval);
                moveRightInterval = null;
            } else if (event.key === "ArrowLeft") {
                clearInterval(moveLeftInterval);
                moveLeftInterval = null;
            }
        });

        function jump() {
            isJumping = true;
            let upInterval = setInterval(() => {
                if (positionY >= 150) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (positionY <= 0 || onPlatform()) {
                            clearInterval(downInterval);
                            isJumping = false;
                            if (!onPlatform()) {
                                positionY -= gravity;
                            }
                        } else {
                            positionY -= gravity;
                        }
                        player.style.bottom = positionY + "px";
                    }, 20);
                } else {
                    positionY += gravity;
                    player.style.bottom = positionY + "px";
                }
            }, 20);
        }

        function moveRight() {
            positionX += 5;
            player.style.left = positionX + "px";
        }

        function moveLeft() {
            positionX -= 5;
            player.style.left = positionX + "px";
        }

        function onPlatform() {
            return Array.from(platforms).some(platform => {
                const platformRect = platform.getBoundingClientRect();
                const playerRect = player.getBoundingClientRect();
                return playerRect.bottom >= platformRect.top && 
                       playerRect.bottom <= platformRect.bottom &&
                       playerRect.left + 10 >= platformRect.left &&
                       playerRect.right - 10 <= platformRect.right;
            });
        }
    </script>
</body>
</html>
