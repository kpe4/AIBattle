<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini Platformer</title>
<style>
body{
  margin:0;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:sans-serif;
}
canvas{
  background:#87ceeb;
  border:3px solid #000;
}
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

const gravity = 0.5;

const player = {
  x:100,
  y:0,
  w:30,
  h:30,
  dx:0,
  dy:0,
  speed:4,
  jump:10,
  grounded:false
};

const keys = {};

const platforms = [
  {x:0,y:370,w:800,h:30},
  {x:150,y:300,w:120,h:20},
  {x:320,y:250,w:120,h:20},
  {x:500,y:200,w:120,h:20},
  {x:650,y:320,w:100,h:20}
];

document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function update(){

  if(keys["ArrowLeft"]) player.dx = -player.speed;
  else if(keys["ArrowRight"]) player.dx = player.speed;
  else player.dx = 0;

  if((keys["ArrowUp"] || keys["Space"]) && player.grounded){
    player.dy = -player.jump;
    player.grounded = false;
  }

  player.dy += gravity;

  player.x += player.dx;
  player.y += player.dy;

  player.grounded = false;

  for(let p of platforms){
    if(collide(player,p)){
      if(player.dy > 0 && player.y + player.h - player.dy <= p.y){
        player.y = p.y - player.h;
        player.dy = 0;
        player.grounded = true;
      }
    }
  }

  if(player.y > c.height){
    player.x = 100;
    player.y = 0;
    player.dy = 0;
  }
}

function draw(){

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#654321";
  for(let p of platforms){
    ctx.fillRect(p.x,p.y,p.w,p.h);
  }

  ctx.fillStyle="#ff4444";
  ctx.fillRect(player.x,player.y,player.w,player.h);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
