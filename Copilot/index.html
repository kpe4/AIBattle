<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мини‑платформер</title>
<style>
  body { margin:0; overflow:hidden; background:#222; }
  canvas { background:#333; display:block; margin:0 auto; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

const player = {
  x: 100, y: 0, w: 40, h: 40,
  vx: 0, vy: 0,
  speed: 4,
  jump: 12,
  onGround: false
};

const platforms = [
  {x:0, y:400, w:800, h:50},
  {x:300, y:300, w:200, h:20},
  {x:550, y:200, w:150, h:20}
];

function update() {
  player.vx = 0;

  if (keys["ArrowLeft"]) player.vx = -player.speed;
  if (keys["ArrowRight"]) player.vx = player.speed;

  if (keys["Space"] && player.onGround) {
    player.vy = -player.jump;
    player.onGround = false;
  }

  player.vy += 0.5; // гравитация
  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;

  // столкновения
  for (let p of platforms) {
    if (player.x < p.x + p.w &&
        player.x + player.w > p.x &&
        player.y < p.y + p.h &&
        player.y + player.h > p.y) {

      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  if (player.y > c.height) {
    player.x = 100;
    player.y = 0;
    player.vy = 0;
  }
}

function draw() {
  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle = "#4af";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "#0f0";
  for (let p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
